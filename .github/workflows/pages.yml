name: Publish War Report

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Test the report picker
        run: python3 -m unittest discover -s scripts

      - name: Fetch every guild sheet's report and publish the best one
        env:
          # One feed per spreadsheet that captures wars (you, the guild leader, ...).
          REPORT_FEED_URL: ${{ secrets.REPORT_FEED_URL }}
          REPORT_FEED_URL_2: ${{ secrets.REPORT_FEED_URL_2 }}
        run: |
          feeds=()
          i=0
          for url in "$REPORT_FEED_URL" "$REPORT_FEED_URL_2"; do
            [ -n "$url" ] || continue
            i=$((i + 1))
            # A failed fetch is skipped; the picker ignores anything unusable.
            curl --fail --location --silent --show-error --retry 3 --max-time 45               "$url" --output "$RUNNER_TEMP/feed$i.json" || echo '{}' > "$RUNNER_TEMP/feed$i.json"
            feeds+=("$RUNNER_TEMP/feed$i.json")
          done
          if [ ${#feeds[@]} -gt 0 ]; then
            python3 scripts/pick_report.py site/report.json "${feeds[@]}"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
